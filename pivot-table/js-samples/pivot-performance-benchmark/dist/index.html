<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pivot Table performance benchmark</title>
    <script type="module" crossorigin src="/pivot-performance-benchmark/assets/index-HfPoou3K.js"></script>
    <link rel="stylesheet" crossorigin href="/pivot-performance-benchmark/assets/index-nYiJG4my.css">
  </head>
  <body>
    <header class="page-header">
      <h1>Pivot Table performance benchmark</h1>
      <p>
        Generate a synthetic dataset, populate the pivot engine, and measure how long each stage
        takes at different record counts with virtualization enabled.
      </p>
    </header>
    <section class="control-panel" aria-label="Benchmark controls">
      <label for="record-count">Records</label>
      <select id="record-count" class="record-count">
        <option value="1000">1,000</option>
        <option value="5000">5,000</option>
        <option value="10000" selected>10,000</option>
        <option value="50000">50,000</option>
        <option value="100000">100,000</option>
        <option value="250000">250,000</option>
      </select>
      <button id="run-benchmark" class="run-button" type="button">Run benchmark</button>
      <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
    </section>
    <section class="results" aria-label="Benchmark results">
      <div class="metric">
        <span class="metric-label">Data generation</span>
        <span id="metric-generation" class="metric-value">—</span>
      </div>
      <div class="metric">
        <span class="metric-label">Pivot population</span>
        <span id="metric-population" class="metric-value">—</span>
      </div>
      <div class="metric">
        <span class="metric-label">Render (first paint)</span>
        <span id="metric-render" class="metric-value">—</span>
      </div>
      <div class="metric">
        <span class="metric-label">Records in view</span>
        <span id="metric-cells" class="metric-value">—</span>
      </div>
    </section>
    <div id="PivotView" class="pivot-table-container"></div>
  </body>
</html>
